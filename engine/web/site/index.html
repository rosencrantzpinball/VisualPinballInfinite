<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Visual Pinball Infinite</title>
<style>
  [hidden] { display: none !important; }
  :root { color-scheme: dark; --ink: #f3ede0; --dim: #b9b1a1; --gold: #d8b45a; --bg: #0b0b0d; }
  html, body { margin: 0; height: 100%; background: var(--bg); color: var(--ink); font: 16px/1.45 system-ui, -apple-system, "Segoe UI", sans-serif; overflow: hidden; }
  #table { position: fixed; inset: 0; width: 100vw; height: 100vh; display: block; outline: none; touch-action: none; }
  #overlay { position: fixed; inset: 0; display: grid; place-items: center; background: radial-gradient(ellipse at center, rgba(11,11,13,.72), rgba(11,11,13,.94)); }
  .card { max-width: min(560px, calc(100vw - 32px)); padding: 28px 24px; text-align: center; }
  h1 { margin: 0 0 4px; font-size: clamp(22px, 4vw, 34px); letter-spacing: .02em; color: var(--gold); font-weight: 650; }
  #byline { margin: 0 0 20px; color: var(--dim); }
  progress { width: 100%; height: 6px; appearance: none; border: 0; border-radius: 3px; background: #2a2724; overflow: hidden; }
  progress::-webkit-progress-bar { background: #2a2724; }
  progress::-webkit-progress-value { background: var(--gold); }
  progress::-moz-progress-bar { background: var(--gold); }
  #status { min-height: 1.5em; margin: 12px 0 0; color: var(--dim); }
  #play { margin-top: 18px; padding: 12px 34px; font: inherit; font-size: 18px; font-weight: 600; color: #15120b; background: var(--gold); border: 0; border-radius: 999px; cursor: pointer; }
  #play:hover { filter: brightness(1.08); }
  .keys { margin: 22px 0 0; color: var(--dim); font-size: 14px; }
  kbd { padding: 1px 6px; border: 1px solid #4a453c; border-radius: 4px; font: 13px ui-monospace, monospace; color: var(--ink); }
  #fullscreen { position: fixed; right: 12px; bottom: 12px; padding: 6px 12px; font: 13px system-ui, sans-serif; color: var(--ink); background: rgba(20,19,17,.6); border: 1px solid #4a453c; border-radius: 6px; cursor: pointer; opacity: .55; }
  #fullscreen:hover { opacity: 1; }
  .credit { position: fixed; left: 12px; bottom: 12px; font-size: 12px; color: #6f685c; }
  .credit a { color: inherit; }
</style>
</head>
<body>
<canvas id="table" tabindex="0"></canvas>
<div id="overlay">
  <div class="card">
    <h1 id="title">Visual Pinball Infinite</h1>
    <p id="byline"></p>
    <progress id="progress" value="0" max="1"></progress>
    <p id="status">Getting ready…</p>
    <button id="play" hidden>Play</button>
    <p class="keys">Flippers <kbd>Shift</kbd> · Plunger <kbd>Enter</kbd> · Start <kbd>1</kbd> · Coin <kbd>5</kbd> · Nudge <kbd>Z</kbd> <kbd>/</kbd> <kbd>Space</kbd> · Menu <kbd>Esc</kbd><br>or a gamepad: triggers or shoulders flip, A launches, B starts, Back opens the menu</p>
  </div>
</div>
<button id="fullscreen" title="Full screen">Full screen</button>
<div class="credit">Visual Pinball Infinite · <a href="https://github.com/VPinInfinite/VisualPinballInfinite">GPL-3.0</a></div>
<script type="module" src="vpi.js"></script>
</body>
</html>
